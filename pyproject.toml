[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heliostat"
version = "1.9.3"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "pymodbus>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration checks",
]
